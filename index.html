<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Sayi Lorena Ramirez Alvarez, Samir Rosero">
  <title>Parcial 2 - Desarrollo de Aplicaciones Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a class="navbar__logo" href="#">
        <img src="img/logo.png" alt="Disney">
      </a>
      <button class="navbar__toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="navbar-collapse">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="navbar__collapse" id="navbar-collapse">
        <ul class="navbar__menu">
          <li><a class="navbar__link" href="#">DISNEY+</a></li>
          <li><a class="navbar__link" href="#">PARKS &amp; TRAVEL</a></li>
          <li><a class="navbar__link" href="#">MOVIES</a></li>
          <li><a class="navbar__link" href="#">SHOP</a></li>
          <li><a class="navbar__link" href="#">MORE</a></li>
        </ul>
        <a class="navbar__login" href="#">LOG IN</a>
        <form class="navbar__search" action="#">
          <input class="navbar__search-input" type="search" placeholder="Search" aria-label="Search">
          <button class="navbar__search-btn" type="submit" aria-label="Buscar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="10" cy="10" r="7.5"></circle>
              <line x1="15.5" y1="15.5" x2="22" y2="22"></line>
            </svg>
          </button>
        </form>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero__content">
        <img class="hero__logo" src="img/snow-white.png" alt="Disney Snow White">
        <p class="hero__text">Experience <em>Snow White</em>, now playing only in theaters!</p>
        <a class="hero__btn hero__btn--primary" href="#">Get Tickets Now</a>
        <a class="hero__btn hero__btn--secondary" href="#">Learn More</a>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
